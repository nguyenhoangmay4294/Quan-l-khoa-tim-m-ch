<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ClinCase · Ca lâm sàng</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e6edf7;--card:#fff;--ink:#12303a;--mute:#5d7480;--teal:#0f8b8d;--line:#d6e0ec;--sh:0 8px 22px rgba(60,90,140,.14),-4px -4px 12px rgba(255,255,255,.8);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a24;--card:#18262f;--ink:#e6f1f4;--mute:#8aa3ae;--line:#26394a;--sh:0 8px 22px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0f1a24;--card:#18262f;--ink:#e6f1f4;--mute:#8aa3ae;--line:#26394a;--sh:0 8px 22px rgba(0,0,0,.4)}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Be Vietnam Pro",system-ui,sans-serif;min-height:100vh}
#app{max-width:560px;margin:0 auto;padding:14px 16px 110px}
h1{font-size:28px;line-height:1.2;margin:14px 0 6px;font-weight:800}h2{font-size:18px;margin:22px 0 10px}h3{margin:0;font-size:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
.logo i{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-style:normal;background:linear-gradient(135deg,#d63a73,#f06292);color:#fff;font-size:20px}
.pill{border:0;background:var(--card);color:var(--ink);box-shadow:var(--sh);border-radius:999px;padding:8px 14px;font:600 13px inherit;font-family:inherit;cursor:pointer}
.btn{border:0;background:var(--teal);color:#fff;border-radius:16px;padding:13px 20px;font:700 15px "Be Vietnam Pro";cursor:pointer;box-shadow:var(--sh)}
.btn.alt{background:var(--card);color:var(--ink)}.btn.red{background:#b3261e}
.hero{background:linear-gradient(135deg,#0f8b8d,#2b7bb9);color:#fff;border-radius:28px;padding:20px;box-shadow:var(--sh);margin-top:14px}
.hero p{margin:0 0 14px;opacity:.92}.hero .btn{background:#fff;color:#0f6f72}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stat{background:var(--card);border-radius:20px;padding:12px;box-shadow:var(--sh)}.stat b{font-size:24px;display:block}.stat span{font-size:12px;color:var(--mute)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.zone{border:0;text-align:center;border-radius:28px;padding:18px 8px 14px;box-shadow:var(--sh);cursor:pointer;font-family:inherit;background:var(--card);color:inherit}
.zone .ic{width:62px;height:62px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;font-size:28px;box-shadow:inset 0 -4px 8px rgba(0,0,0,.2)}
.zone b{display:block;font-size:15px}.zone small{color:var(--mute)}
.card{background:var(--card);border-radius:22px;padding:14px 16px;box-shadow:var(--sh);margin-bottom:12px}
.case{display:flex;gap:12px;align-items:center;cursor:pointer}
.case .ic{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:22px}
.case .t{flex:1;min-width:0}.case .t b{display:block}.case .t small{color:var(--mute)}
.tag{display:inline-block;background:var(--bg);border-radius:999px;padding:2px 10px;font-size:12px;margin:4px 4px 0 0;color:var(--mute)}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#0f8b8d,#4cc4c6)}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:11px 12px;font:inherit;margin:4px 0 10px}
label{font-weight:600;font-size:13px;color:var(--mute)}textarea{min-height:76px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);box-shadow:0 -6px 20px rgba(60,90,140,.15);padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:2px;z-index:5}
.nav button{flex:1;max-width:100px;border:0;background:none;color:var(--mute);font:600 11px "Be Vietnam Pro";cursor:pointer;padding:4px 0}
.nav button span{display:block;font-size:22px}.nav button.on{color:var(--teal)}
.sec{border-left:4px solid var(--teal);padding-left:12px;margin:14px 0}.sec b{color:var(--teal);font-size:13px}.sec p{margin:2px 0;white-space:pre-wrap}
.dx{background:linear-gradient(135deg,#fff3f6,#fde8ee);color:#7a1d3a;border-radius:18px;padding:12px 14px;font-weight:700}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px}.chips .pill.on{background:var(--teal);color:#fff}
.warn{font-size:12px;color:var(--mute);background:var(--card);border-radius:14px;padding:10px 12px;margin:10px 0}
.empty{text-align:center;color:var(--mute);padding:30px 10px}
.back{margin:10px 0}
.gb{border-radius:28px;padding:18px;color:#fff;box-shadow:var(--sh)}.gb .bar{background:rgba(255,255,255,.25);margin:10px 0}
.gc{border-radius:26px;padding:14px;color:#fff;box-shadow:var(--sh);display:flex;flex-direction:column;gap:8px}.gc p{margin:0;font-size:12px;flex:1}.gc .btn{background:#fff;color:#12303a;padding:10px;border-radius:14px;font-size:14px;width:100%}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:12px 14px;margin:8px 0;font:600 14px "Be Vietnam Pro",sans-serif;cursor:pointer}.opt.ok{border-color:#1f8a5b;background:#e3f6ec;color:#0d4f33}.opt.no{border-color:#b3261e;background:#fdeceb;color:#7a1410}
button:disabled{opacity:.6;cursor:default}
:focus-visible{outline:3px solid #2b7bb9;outline-offset:2px}
</style></head><body><div id="app"></div>
<script>
const S=[['tm','Tim mạch','🫀','#d63a73','#f06292'],['cc','Cấp cứu','🚑','#b3261e','#e05a4f'],['hh','Hô hấp','🫁','#2b7bb9','#5aa9e6'],['tk','Thần kinh','🧠','#7b4bb7','#a67bd9'],['th','Tiêu hóa','🩺','#c98a0a','#f3c24f'],['nt','Nội tiết','🧪','#1f8a5b','#4cbf8b'],['nh','Nhi khoa','👶','#0f8b8d','#4cc4c6'],['cd','Chẩn đoán hình ảnh','🩻','#3a4a9f','#6b7fd6']];
const sp=id=>S.find(s=>s[0]===id)||S[0];
const SEED=[
{id:1,title:'Nhồi máu cơ tim thành dưới kèm nhồi máu thất phải',spec:'tm',age:58,sex:'Nam',complaint:'Đau thắt ngực dữ dội 2 giờ, vã mồ hôi, tụt huyết áp.',history:'Tăng huyết áp, hút thuốc lá nhiều năm. Đau sau xương ức lan hàm, không đỡ khi nghỉ.',exam:'Huyết áp 85/50 mmHg, mạch 48 l/p, tĩnh mạch cổ nổi, phổi trong.',tests:'ECG: ST chênh lên DII, DIII, aVF; V4R chênh lên; block nhĩ thất độ 3 thoáng qua. Troponin tăng.',dx:'STEMI thành dưới, nhồi máu thất phải do tắc động mạch vành phải đoạn gần.',mgmt:'Can thiệp động mạch vành cấp cứu. Truyền dịch, tránh nitrate và lợi tiểu khi tiền gánh phụ thuộc. Theo dõi nhịp chậm.',lesson:'Luôn ghi chuyển đạo bên phải ở nhồi máu thành dưới có tụt huyết áp.',tags:['STEMI','ECG','Thất phải'],diff:2,learned:false,fav:true,date:'2026-11-01'},
{id:2,title:'Thuyên tắc phổi sau phẫu thuật',spec:'hh',age:34,sex:'Nữ',complaint:'Khó thở đột ngột và đau ngực kiểu màng phổi ngày thứ 6 sau mổ.',history:'Mổ lấy thai, nằm lâu, không dự phòng huyết khối.',exam:'Nhịp tim 118 l/p, SpO2 90% khí phòng, một bắp chân sưng đau.',tests:'D-dimer tăng cao. CT mạch phổi: khuyết thuốc động mạch phổi hai bên.',dx:'Thuyên tắc phổi cấp nguy cơ trung bình.',mgmt:'Chống đông (heparin) rồi chuyển thuốc uống, thở oxy, theo dõi chức năng thất phải.',lesson:'Dùng thang điểm Wells để ước tính xác suất trước khi chỉ định D-dimer.',tags:['PE','Wells','CTPA'],diff:2,learned:false,fav:false,date:'2026-11-03'},
{id:3,title:'Nhồi máu não cấp trong cửa sổ tiêu sợi huyết',spec:'tk',age:67,sex:'Nam',complaint:'Liệt nửa người phải, nói khó cách nhập viện 90 phút.',history:'Rung nhĩ không dùng thuốc chống đông.',exam:'NIHSS 12, huyết áp 160/90, đường huyết bình thường.',tests:'CT sọ không cản quang không xuất huyết. CT mạch: tắc động mạch não giữa.',dx:'Nhồi máu não cấp do thuyên tắc từ tim, rung nhĩ.',mgmt:'Tiêu sợi huyết đường tĩnh mạch trong cửa sổ thời gian, cân nhắc lấy huyết khối cơ học, dự phòng sau đó.',lesson:'Thời gian là não: rút ngắn từ cửa đến kim.',tags:['Đột quỵ','NIHSS','Rung nhĩ'],diff:3,learned:false,fav:false,date:'2026-11-05'},
{id:4,title:'Nhiễm toan ceton đái tháo đường type 1',spec:'nt',age:19,sex:'Nữ',complaint:'Buồn nôn, đau bụng, thở sâu nhanh, lơ mơ.',history:'Đái tháo đường type 1, ngừng tiêm insulin 2 ngày do sốt.',exam:'Thở Kussmaul, mất nước, hơi thở mùi trái cây.',tests:'Đường huyết 28 mmol/L, pH 7,10, bicarbonate thấp, ceton máu dương tính.',dx:'Nhiễm toan ceton đái tháo đường do ngừng insulin.',mgmt:'Bù dịch trước, kiểm tra kali, bắt đầu insulin khi kali đạt ngưỡng an toàn, tìm và xử trí yếu tố khởi phát.',lesson:'Kiểm tra kali trước khi truyền insulin.',tags:['DKA','Kali','Insulin'],diff:1,learned:false,fav:false,date:'2026-11-07'}];
let D=load(),V='home',F='',Q='',ID=null,RI=0,RV=false,ED=false;
function load(){try{const s=localStorage.getItem('cc_cases');if(s)return JSON.parse(s)}catch(e){}return JSON.parse(JSON.stringify(SEED))}
function save(){try{localStorage.setItem('cc_cases',JSON.stringify(D))}catch(e){}}
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ic=(s,sz)=>`<div class="ic" style="background:linear-gradient(135deg,${s[3]},${s[4]})">${s[2]}</div>`;
const go=(v,x)=>{V=v;if(v==='lib'&&x!==undefined)F=x;window.scrollTo(0,0);R()};
const cnt=id=>D.filter(c=>c.spec===id).length;
function hdr(){return `<div class="top"><div class="logo"><i>🫀</i>ClinCase</div><button class="pill" onclick="if(confirm('Đặt lại về 4 ca mẫu? Ca bạn đã thêm sẽ bị xóa.')){D=JSON.parse(JSON.stringify(SEED));save();go('home')}">Đặt lại dữ liệu mẫu</button></div>`}
function caseRow(c){const s=sp(c.spec);return `<div class="card case" onclick="ID=${c.id};ED=false;go('detail')" tabindex="0"><div class="ic" style="background:linear-gradient(135deg,${s[3]},${s[4]})">${s[2]}</div><div class="t"><b>${esc(c.title)}</b><small>${s[1]} · ${esc(c.sex)} ${esc(c.age)} tuổi · ${'★'.repeat(c.diff)}${c.learned?' · ✓ đã nhớ':''}</small><div>${(c.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div></div>${c.fav?'<span>⭐</span>':''}</div>`}
function home(){const l=D.filter(c=>c.learned).length;
return hdr()+`<h1>Học từ từng ca bệnh</h1><div class="hero"><p>Lưu lại ca hay, ôn bằng thẻ nhớ, theo dõi tiến độ theo chuyên khoa.</p><button class="btn" onclick="go('add')">+ Thêm ca mới</button> <button class="btn" style="background:rgba(255,255,255,.2);color:#fff" onclick="go('review')">Ôn tập</button></div>
<div class="stats"><div class="stat"><b>${D.length}</b><span>Ca đã lưu</span></div><div class="stat"><b>${l}</b><span>Đã nhớ</span></div><div class="stat"><b>${D.filter(c=>c.fav).length}</b><span>Đánh dấu</span></div></div>
<h2>Chọn chuyên khoa</h2><div class="grid">${S.map(s=>`<button class="zone" onclick="go('lib','${s[0]}')">${ic(s)}<b style="color:${s[3]}">${s[1]}</b><small>${cnt(s[0])} ca</small></button>`).join('')}</div>
<h2>Ca mới thêm</h2>${D.slice(-3).reverse().map(caseRow).join('')||'<div class="empty">Chưa có ca nào. Bấm “Thêm ca mới”.</div>'}`}
function lib(){const q=Q.toLowerCase();const L=D.filter(c=>(!F||c.spec===F)&&(!q||(c.title+c.dx+(c.tags||[]).join(' ')).toLowerCase().includes(q)));
return hdr()+`<h1>Thư viện ca</h1><input id="q" placeholder="Tìm theo tên, chẩn đoán, thẻ" value="${esc(Q)}" oninput="Q=this.value;R(1)"><div class="chips"><button class="pill ${F?'':'on'}" onclick="F='';R()">Tất cả</button>${S.map(s=>`<button class="pill ${F===s[0]?'on':''}" onclick="F='${s[0]}';R()">${s[2]} ${s[1]}</button>`).join('')}</div>${L.map(caseRow).join('')||'<div class="empty">Không có ca phù hợp. Thử bộ lọc khác hoặc thêm ca mới.</div>'}`}
function detail(){const c=D.find(x=>x.id===ID);if(!c)return lib();const s=sp(c.spec);
const sec=(a,b)=>b?`<div class="sec"><b>${a}</b><p>${esc(b)}</p></div>`:'';
return `<button class="pill back" onclick="go('lib')">← Về danh sách</button><div class="card"><div class="case"><div class="ic" style="background:linear-gradient(135deg,${s[3]},${s[4]})">${s[2]}</div><div class="t"><h3>${esc(c.title)}</h3><small>${s[1]} · ${esc(c.sex)} ${esc(c.age)} tuổi · Độ khó ${'★'.repeat(c.diff)}</small></div></div>
<div>${(c.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
${sec('Lý do vào viện',c.complaint)}${sec('Bệnh sử',c.history)}${sec('Khám lâm sàng',c.exam)}${sec('Cận lâm sàng',c.tests)}
${ED?`<div class="dx">${esc(c.dx)}</div>${sec('Xử trí',c.mgmt)}${sec('Bài học rút ra',c.lesson)}`:`<button class="btn" onclick="ED=true;R()">Thử chẩn đoán, rồi hiện đáp án</button>`}
<p style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px"><button class="btn alt" onclick="tg(${c.id},'fav')">${c.fav?'⭐ Bỏ đánh dấu':'☆ Đánh dấu'}</button><button class="btn alt" onclick="tg(${c.id},'learned')">${c.learned?'✓ Đã nhớ':'Đánh dấu đã nhớ'}</button><button class="btn red" onclick="if(confirm('Xóa ca này?')){D=D.filter(x=>x.id!==${c.id});save();go('lib')}">Xóa</button></p></div>`}
function tg(id,k){const c=D.find(x=>x.id===id);c[k]=!c[k];save();R()}
function add(){return hdr()+`<h1>Thêm ca lâm sàng</h1><div class="warn">🔒 Chỉ ghi dữ liệu đã ẩn danh: không họ tên, số hồ sơ, ngày sinh đầy đủ hay thông tin định danh bệnh nhân. Dữ liệu chỉ lưu trên thiết bị này.</div>
<div class="card"><label>Tiêu đề ca</label><input id="f_title" placeholder="Ví dụ: Viêm cơ tim cấp ở người trẻ">
<div class="row"><div><label>Chuyên khoa</label><select id="f_spec">${S.map(s=>`<option value="${s[0]}">${s[2]} ${s[1]}</option>`).join('')}</select></div><div><label>Độ khó</label><select id="f_diff"><option value="1">★ Cơ bản</option><option value="2">★★ Trung bình</option><option value="3">★★★ Nâng cao</option></select></div></div>
<div class="row"><div><label>Tuổi</label><input id="f_age" type="number" min="0" max="120"></div><div><label>Giới</label><select id="f_sex"><option>Nam</option><option>Nữ</option></select></div></div>
${[['complaint','Lý do vào viện'],['history','Bệnh sử'],['exam','Khám lâm sàng'],['tests','Cận lâm sàng'],['dx','Chẩn đoán'],['mgmt','Xử trí'],['lesson','Bài học rút ra']].map(a=>`<label>${a[1]}</label><textarea id="f_${a[0]}"></textarea>`).join('')}
<label>Thẻ (cách nhau bằng dấu phẩy)</label><input id="f_tags" placeholder="ECG, Troponin">
<button class="btn" onclick="sv()">Lưu ca</button></div>`}
function sv(){const g=k=>document.getElementById('f_'+k).value.trim();
if(!g('title')||!g('dx')){alert('Cần nhập tiêu đề và chẩn đoán để lưu ca.');return}
const id=Date.now();D.push({id,title:g('title'),spec:g('spec'),age:g('age')||'?',sex:g('sex'),complaint:g('complaint'),history:g('history'),exam:g('exam'),tests:g('tests'),dx:g('dx'),mgmt:g('mgmt'),lesson:g('lesson'),tags:g('tags').split(',').map(t=>t.trim()).filter(Boolean),diff:+g('diff'),learned:false,fav:false,date:new Date().toISOString().slice(0,10)});save();ID=id;ED=false;go('detail')}
function review(){const L=D.filter(c=>!c.learned);
if(!L.length)return hdr()+`<h1>Ôn tập</h1><div class="empty">🎉 Bạn đã nhớ hết ${D.length} ca. Thêm ca mới hoặc bỏ đánh dấu để ôn lại.</div>`;
const c=L[RI%L.length],s=sp(c.spec);
return hdr()+`<h1>Ôn tập thẻ nhớ</h1><small>Còn ${L.length} ca chưa nhớ</small><div class="card" style="margin-top:12px"><div class="case"><div class="ic" style="background:linear-gradient(135deg,${s[3]},${s[4]})">${s[2]}</div><div class="t"><b>${s[1]}</b><small>${esc(c.sex)} ${esc(c.age)} tuổi</small></div></div>
<div class="sec"><b>Lý do vào viện</b><p>${esc(c.complaint)}</p></div><div class="sec"><b>Khám và cận lâm sàng</b><p>${esc(c.exam)}\n${esc(c.tests)}</p></div>
${RV?`<div class="dx">${esc(c.dx)}</div><div class="sec"><b>Xử trí</b><p>${esc(c.mgmt)}</p></div><p style="display:flex;gap:8px"><button class="btn" onclick="rv(${c.id},1)">Đã nhớ</button><button class="btn alt" onclick="rv(${c.id},0)">Cần ôn lại</button></p>`:`<button class="btn" onclick="RV=true;R()">Hiện chẩn đoán</button>`}</div>`}
function rv(id,ok){if(ok){D.find(x=>x.id===id).learned=true;save()}else RI++;RV=false;R()}
function stats(){return hdr()+`<h1>Tiến độ học</h1><div class="card"><b>Tổng cộng: ${D.filter(c=>c.learned).length}/${D.length} ca đã nhớ</b><div class="bar"><i style="width:${D.length?100*D.filter(c=>c.learned).length/D.length:0}%"></i></div></div>`+S.map(s=>{const n=cnt(s[0]),l=D.filter(c=>c.spec===s[0]&&c.learned).length;return `<div class="card case" onclick="go('lib','${s[0]}')"><div class="ic" style="background:linear-gradient(135deg,${s[3]},${s[4]})">${s[2]}</div><div class="t"><b>${s[1]}</b><small>${l}/${n} ca đã nhớ</small><div class="bar"><i style="width:${n?100*l/n:0}%"></i></div></div></div>`}).join('')}
let XP=(()=>{try{return JSON.parse(localStorage.getItem('cc_xp'))||{xp:0,best:0,games:0}}catch(e){return{xp:0,best:0,games:0}}})(),G=null;
function sx(){try{localStorage.setItem('cc_xp',JSON.stringify(XP))}catch(e){}}
const sh=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);
const lv=()=>Math.floor(XP.xp/100)+1;
function begin(mode,spec){const pool=D.filter(c=>!spec||c.spec===spec);
if(!pool.length||D.length<2){alert('Cần ít nhất 2 ca trong thư viện, và khoa đã chọn phải có ca.');return}
const dxs=[...new Set(D.map(c=>c.dx))];
const qs=(mode==='tf'?Array.from({length:6},()=>sh(pool)[0]):sh(pool).slice(0,5)).map(c=>{const other=sh(dxs.filter(x=>x!==c.dx));
if(mode==='tf'){const t=Math.random()<.5||!other.length;return{c,shown:t?c.dx:other[0],truth:t}}
return{c,opts:sh([c.dx,...other.slice(0,3)])}});
G={mode,spec,qs,i:0,score:0,streak:0,ok:0,sel:null,done:false};R()}
function ans(k){if(G.sel!==null)return;const q=G.qs[G.i];G.sel=k;
const ok=G.mode==='tf'?(k==1)===q.truth:q.opts[k]===q.c.dx;
if(ok){G.streak++;G.ok++;G.score+=10+2*(G.streak-1)}else G.streak=0;R()}
function gnext(){G.i++;G.sel=null;if(G.i>=G.qs.length){G.done=true;XP.xp+=G.score;XP.best=Math.max(XP.best,G.score);XP.games++;sx()}R()}
function gview(){const g=G;
if(g.done)return `<div class="card" style="text-align:center;margin-top:16px"><div style="font-size:54px">${g.ok>=g.qs.length*.8?'🏆':'💪'}</div><h2>${g.ok}/${g.qs.length} câu đúng</h2><p><b>+${g.score} XP</b> · Cấp ${lv()}</p><p style="display:flex;gap:8px;justify-content:center"><button class="btn" onclick="begin('${g.mode}','${g.spec||''}')">Chơi lại</button><button class="btn alt" onclick="G=null;R()">Về sảnh</button></p></div>`;
const q=g.qs[g.i],c=q.c,s=sp(c.spec),a=g.sel!==null;
const right=g.mode==='tf'?(g.sel==1)===q.truth:(a&&q.opts[g.sel]===c.dx);
let body=`<div class="sec"><b>Lý do vào viện</b><p>${esc(c.complaint)}</p></div><div class="sec"><b>Khám và cận lâm sàng</b><p>${esc(c.exam)}\n${esc(c.tests)}</p></div>`;
if(g.mode==='tf')body+=`<div class="dx" style="background:var(--bg);color:var(--ink)">Chẩn đoán đề xuất: ${esc(q.shown)}</div><p style="display:flex;gap:8px"><button class="btn" style="flex:1" onclick="ans(1)" ${a?'disabled':''}>✓ Đúng</button><button class="btn red" style="flex:1" onclick="ans(0)" ${a?'disabled':''}>✕ Sai</button></p>`;
else body+=q.opts.map((o,k)=>`<button class="opt ${a?(o===c.dx?'ok':k===g.sel?'no':''):''}" onclick="ans(${k})">${esc(o)}</button>`).join('');
if(a)body+=`<div class="warn"><b>${right?'Chính xác!':'Chưa đúng.'}</b> Đáp án: ${esc(c.dx)}<br>${esc(c.lesson)}</div><button class="btn" onclick="gnext()">${g.i+1<g.qs.length?'Câu tiếp':'Xem kết quả'}</button>`;
return `<div class="top"><button class="pill" onclick="G=null;R()">← Thoát</button><span class="pill">Điểm ${g.score} · 🔥${g.streak}</span></div><h2>${s[2]} Câu ${g.i+1}/${g.qs.length}</h2><div class="bar"><i style="width:${100*g.i/g.qs.length}%"></i></div><div class="card" style="margin-top:12px">${body}</div>`}
function play(){if(G)return gview();
const day=D.length?D[Math.floor(Date.now()/864e5)%D.length]:null,pr=XP.xp%100;
return hdr()+`<h1>Đấu trường ca bệnh</h1><div class="gb" style="background:linear-gradient(135deg,#0f8b8d,#3a4a9f)"><b style="font-size:20px">🏅 Cấp ${lv()}</b><div class="bar"><i style="width:${pr}%;background:#ffd36b"></i></div><small>${XP.xp} XP · còn ${100-pr} XP lên cấp · Điểm cao nhất ${XP.best}</small></div>
<h2>Chọn trò chơi</h2><div class="grid"><div class="gc" style="background:linear-gradient(135deg,#f59a23,#e8456b)"><h3>🩺 Chẩn đoán nhanh</h3><p>Đọc ca, chọn chẩn đoán đúng. Chuỗi đúng được cộng thêm điểm.</p><button class="btn" onclick="begin('quiz','')">Chơi ngay</button></div><div class="gc" style="background:linear-gradient(135deg,#2b6fd6,#8a5bd6)"><h3>🎯 Đúng hay sai</h3><p>Chẩn đoán đề xuất có khớp với ca bệnh không? Quyết định thật nhanh.</p><button class="btn" onclick="begin('tf','')">Chơi ngay</button></div></div>
${day?`<h2>Ca hôm nay</h2><div class="card case" onclick="ID=${day.id};ED=false;go('detail')"><div class="ic" style="background:linear-gradient(135deg,${sp(day.spec)[3]},${sp(day.spec)[4]})">${sp(day.spec)[2]}</div><div class="t"><b>${esc(day.title)}</b><small>Đọc ca và thử chẩn đoán trước</small></div></div>`:''}
<h2>Bản đồ phiêu lưu</h2><small>Chơi để nhận XP và mở khóa thêm chuyên khoa.</small><div style="margin-top:10px">${S.map((s,i)=>{const n=cnt(s[0]),l=D.filter(c=>c.spec===s[0]&&c.learned).length,need=i*30,lk=XP.xp<need;
return `<div class="card case" style="${lk?'opacity:.6':''}"><div class="ic" style="background:linear-gradient(135deg,${s[3]},${s[4]})">${lk?'🔒':s[2]}</div><div class="t"><b>${s[1]}</b><small>${lk?`Cần ${need} XP`:`${l}/${n} ca đã nhớ`}</small><div class="bar"><i style="width:${n?100*l/n:0}%"></i></div></div>${lk?'':`<button class="pill" onclick="begin('quiz','${s[0]}')">Đi ▶</button>`}</div>`}).join('')}</div>`}
function nav(){const t=[['home','🏠','Trang chủ'],['lib','📚','Thư viện'],['add','➕','Thêm ca'],['review','🃏','Ôn tập'],['play','🎮','Chơi'],['stats','📊','Tiến độ']];
return `<div class="nav">${t.map(a=>`<button class="${V===a[0]||(V==='detail'&&a[0]==='lib')?'on':''}" onclick="go('${a[0]}',${a[0]==='lib'?"''":'undefined'})"><span>${a[1]}</span>${a[2]}</button>`).join('')}</div>`}
function R(keep){const v={home,lib,detail,add,review,stats,play}[V]();const a=document.getElementById('app');
if(keep){const el=document.getElementById('q'),p=el.selectionStart;a.innerHTML=v+nav();const n=document.getElementById('q');n.focus();n.setSelectionRange(p,p)}else a.innerHTML=v+nav()}
R();
</script></body></html>
